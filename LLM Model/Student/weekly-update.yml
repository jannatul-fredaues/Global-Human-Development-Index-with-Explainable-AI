name: Weekly dataset update

on:
  schedule:
    - cron: "0 3 * * 1"   # every Monday 03:00 UTC
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab too

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run update script
        run: python update_dataset.py

      - name: Train candidate models and select the best
        run: python train_and_select_model.py

      - name: Commit and push updated dataset and model
        run: |
          git config user.name "dataset-bot"
          git config user.email "dataset-bot@users.noreply.github.com"
          git add student_dataset.xlsx update_log.txt best_model.joblib model_leaderboard.json
          git diff --cached --quiet || git commit -m "Weekly automated dataset + model update"
          git push
